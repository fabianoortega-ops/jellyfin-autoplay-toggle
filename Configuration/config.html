<div data-role="page" class="page type-interior pluginConfigurationPage AutoPlayToggle">
    <div class="content-primary">
        <style>
            .apt-card { background:#1c1c1c; border:1px solid #333; border-radius:10px; padding:24px; max-width:480px; margin:24px auto; }
            .apt-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
            .apt-logo { width:64px; height:64px; border-radius:14px; flex-shrink:0; }
            .apt-title { font-size:1.4em; font-weight:700; color:#ffffff; line-height:1.2; }
            .apt-title span { color:#00a4dc; display:block; }
            .apt-subtitle { font-size:0.9em; color:#666; margin-top:4px; }
            .apt-divider { border:none; border-top:1px solid #2a2a2a; margin:0 0 20px; }
            .apt-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
            .apt-label { font-size:1em; color:#ccc; }
            .apt-switch { position:relative; display:inline-block; width:56px; height:30px; }
            .apt-switch input { opacity:0; width:0; height:0; }
            .apt-slider { position:absolute; cursor:pointer; inset:0; background:#555; border-radius:30px; transition:background 0.3s; }
            .apt-slider:before { content:""; position:absolute; width:22px; height:22px; left:4px; bottom:4px; background:white; border-radius:50%; transition:transform 0.3s; }
            input:checked + .apt-slider { background:#00a4dc; }
            input:checked + .apt-slider:before { transform:translateX(26px); }
            .apt-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.82em; font-weight:600; text-transform:uppercase; }
            .apt-badge-on   { background:#00a4dc22; color:#00a4dc; border:1px solid #00a4dc55; }
            .apt-badge-off  { background:#ff444422; color:#ff6666; border:1px solid #ff444455; }
            .apt-badge-load { background:#44444422; color:#888;    border:1px solid #44444455; }
            .apt-hint  { font-size:0.82em; color:#666; margin-top:16px; line-height:1.5; }
            .apt-error { color:#ff6666; font-size:0.85em; margin-top:10px; display:none; }
        </style>

        <div class="apt-card">
            <div class="apt-header">
                <svg class="apt-logo" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="aptbg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0a0a0a"/>
                            <stop offset="50%" stop-color="#001a24"/>
                            <stop offset="100%" stop-color="#0a0a0a"/>
                        </linearGradient>
                    </defs>
                    <rect width="256" height="256" rx="46" fill="url(#aptbg)"/>
                    <rect x="24" y="57" width="208" height="56" rx="28" fill="#00a4dc"/>
                    <circle cx="204" cy="85" r="24" fill="#ffffff"/>
                    <polygon points="193,73 193,97 218,85" fill="#00a4dc"/>
                    <text x="128" y="170" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">AutoPlay</text>
                    <text x="128" y="220" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="46" font-weight="700" fill="#00a4dc" text-anchor="middle">Toggle</text>
                </svg>
                <div>
                    <div class="apt-title">AutoPlay<span>Toggle</span></div>
                    <div class="apt-subtitle">Control autoplay without leaving the Dashboard</div>
                </div>
            </div>
            <hr class="apt-divider">
            <div class="apt-row">
                <span class="apt-label">Reproduzir pr&#243;ximo epis&#243;dio automaticamente</span>
                <label class="apt-switch">
                    <input type="checkbox" id="aptToggle" disabled>
                    <span class="apt-slider"></span>
                </label>
            </div>
            <div class="apt-row" style="justify-content:flex-start;gap:10px;">
                <span class="apt-label" style="font-size:0.9em;color:#777;">Status atual</span>
                <span id="aptBadge" class="apt-badge apt-badge-load">iniciando&#8230;</span>
            </div>
            <div id="aptError" class="apt-error"></div>
            <p class="apt-hint">A altera&#231;&#227;o &#233; aplicada imediatamente na sua conta do Jellyfin.</p>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            var _done = false;
            function badge(state) {
                var b = document.getElementById("aptBadge");
                if (state === "on")       { b.textContent = "Ligado";    b.className = "apt-badge apt-badge-on"; }
                else if (state === "off") { b.textContent = "Desligado"; b.className = "apt-badge apt-badge-off"; }
                else                      { b.textContent = state;       b.className = "apt-badge apt-badge-load"; }
            }
            function showErr(msg) {
                var e = document.getElementById("aptError");
                if (msg) { e.textContent = "\u26a0 " + msg; e.style.display = "block"; }
                else     { e.style.display = "none"; }
            }
            function getToken() {
                try {
                    var ac = window.ApiClient;
                    if (!ac) return null;
                    if (typeof ac.accessToken === "function") return ac.accessToken();
                    return ac.accessToken || ac._accessToken || null;
                } catch(e) { return null; }
            }
            function getUserId() {
                try {
                    var ac = window.ApiClient;
                    if (!ac) return null;
                    if (typeof ac.getCurrentUserId === "function") return ac.getCurrentUserId();
                    return ac.currentUserId || ac._currentUserId || null;
                } catch(e) { return null; }
            }
            function callApi(method, path, body) {
                return fetch(window.location.origin + "/" + path, {
                    method: method,
                    headers: {
                        "Authorization": "MediaBrowser Token=\"" + getToken() + "\"",
                        "Content-Type":  "application/json"
                    },
                    body: body ? JSON.stringify(body) : undefined
                }).then(function(r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    if (r.status === 204) return null;
                    return r.json().catch(function() { return null; });
                });
            }
            function loadStatus(userId) {
                badge("carregando\u2026");
                callApi("GET", "Users/" + userId)
                    .then(function(u) {
                        var enabled = u && u.Configuration && u.Configuration.EnableNextEpisodeAutoPlay;
                        var t = document.getElementById("aptToggle");
                        t.checked  = !!enabled;
                        t.disabled = false;
                        badge(enabled ? "on" : "off");
                        showErr(null);
                    })
                    .catch(function(e) { badge("erro"); showErr(e.message); });
            }
            function saveStatus(userId, val) {
                var t = document.getElementById("aptToggle");
                t.disabled = true;
                badge("salvando\u2026");
                callApi("GET", "Users/" + userId)
                    .then(function(u) {
                        var cfg = Object.assign({}, u.Configuration, { EnableNextEpisodeAutoPlay: val });
                        return callApi("POST", "Users/" + userId + "/Configuration", cfg);
                    })
                    .then(function() {
                        t.disabled = false;
                        t.checked  = val;
                        badge(val ? "on" : "off");
                        showErr(null);
                    })
                    .catch(function(e) {
                        t.checked  = !val;
                        t.disabled = false;
                        badge(!val ? "on" : "off");
                        showErr(e.message);
                    });
            }
            function init() {
                if (_done) return;
                var ac = window.ApiClient;
                if (!ac) { setTimeout(init, 200); return; }
                var uid = getUserId();
                if (!uid) { setTimeout(init, 200); return; }
                _done = true;
                loadStatus(uid);
                document.getElementById("aptToggle").addEventListener("change", function () {
                    saveStatus(uid, this.checked);
                });
            }
            var page = document.querySelector(".AutoPlayToggle");
            if (page) {
                page.addEventListener("pageshow", init);
                page.addEventListener("viewshow", init);
            }
            setTimeout(init, 500);
        }());
    </script>
</div>
