<!DOCTYPE html>
<html>
<head>
    <title>AutoPlay Toggle</title>
    <style>
        .apt-card { background:#1c1c1c; border:1px solid #333; border-radius:10px; padding:24px; max-width:480px; margin:24px auto; }
        .apt-title { font-size:1.4em; font-weight:600; color:#e0e0e0; margin-bottom:6px; }
        .apt-subtitle { font-size:0.9em; color:#888; margin-bottom:24px; }
        .apt-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .apt-label { font-size:1em; color:#ccc; }
        .apt-switch { position:relative; display:inline-block; width:56px; height:30px; }
        .apt-switch input { opacity:0; width:0; height:0; }
        .apt-slider { position:absolute; cursor:pointer; inset:0; background:#555; border-radius:30px; transition:background 0.3s; }
        .apt-slider:before { content:""; position:absolute; width:22px; height:22px; left:4px; bottom:4px; background:white; border-radius:50%; transition:transform 0.3s; }
        input:checked + .apt-slider { background:#00a4dc; }
        input:checked + .apt-slider:before { transform:translateX(26px); }
        .apt-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.82em; font-weight:600; text-transform:uppercase; }
        .apt-badge-on  { background:#00a4dc22; color:#00a4dc; border:1px solid #00a4dc55; }
        .apt-badge-off { background:#ff444422; color:#ff6666; border:1px solid #ff444455; }
        .apt-badge-loading { background:#44444422; color:#888; border:1px solid #44444455; }
        .apt-hint { font-size:0.82em; color:#666; margin-top:16px; line-height:1.5; }
        .apt-error { color:#ff6666; font-size:0.88em; margin-top:10px; display:none; font-family:monospace; }
    </style>
</head>
<body>
<div data-role="page" class="page type-interior pluginConfigurationPage AutoPlayToggle">
    <div class="content-primary">
        <div class="apt-card">
            <div class="apt-title">▶ AutoPlay Toggle</div>
            <div class="apt-subtitle">Controle o autoplay do próximo episódio sem sair desta página.</div>
            <div class="apt-row">
                <span class="apt-label">Reproduzir próximo episódio automaticamente</span>
                <label class="apt-switch">
                    <input type="checkbox" id="aptToggle" disabled>
                    <span class="apt-slider"></span>
                </label>
            </div>
            <div class="apt-row" style="justify-content:flex-start; gap:10px;">
                <span class="apt-label" style="font-size:0.9em; color:#777;">Status:</span>
                <span id="aptBadge" class="apt-badge apt-badge-loading">carregando…</span>
            </div>
            <div id="aptError" class="apt-error"></div>
            <p class="apt-hint">A alteração é aplicada imediatamente na sua conta do Jellyfin.</p>
        </div>
    </div>
</div>

<script type="text/javascript">
(function () {
    "use strict";
    var initialized = false;

    function log(msg) { console.log("[AutoPlayToggle] " + msg); }
    function err(msg, e) { console.error("[AutoPlayToggle] " + msg, e || ""); }

    function setBadge(state) {
        var b = document.getElementById("aptBadge");
        if (state === "on")  { b.textContent = "Ligado";     b.className = "apt-badge apt-badge-on"; }
        else if (state === "off") { b.textContent = "Desligado"; b.className = "apt-badge apt-badge-off"; }
        else                 { b.textContent = "carregando…"; b.className = "apt-badge apt-badge-loading"; }
    }

    function showError(msg) {
        var el = document.getElementById("aptError");
        if (msg) { el.textContent = "⚠ " + msg; el.style.display = "block"; }
        else     { el.style.display = "none"; }
    }

    function getToken() {
        try {
            if (typeof ApiClient.accessToken === "function") return ApiClient.accessToken();
            if (ApiClient.accessToken)   return ApiClient.accessToken;
            if (ApiClient._accessToken)  return ApiClient._accessToken;
        } catch(e) {}
        return null;
    }

    function getUserId() {
        try {
            if (typeof ApiClient.getCurrentUserId === "function") return ApiClient.getCurrentUserId();
            if (ApiClient.currentUserId)  return ApiClient.currentUserId;
            if (ApiClient._currentUserId) return ApiClient._currentUserId;
        } catch(e) {}
        return null;
    }

    function apiFetch(method, path, body) {
        // Usa window.location.origin — sempre correto pois API e web são o mesmo servidor
        var url   = window.location.origin + "/" + path;
        var token = getToken();
        log(method + " " + url + " (token: " + (token ? "ok" : "NULL") + ")");
        var opts = {
            method: method,
            headers: {
                "Authorization": 'MediaBrowser Token="' + token + '"',
                "Content-Type": "application/json"
            }
        };
        if (body) opts.body = JSON.stringify(body);
        return fetch(url, opts);
    }

    function loadStatus(userId) {
        apiFetch("GET", "AutoPlay/Status/" + userId)
            .then(function(r) {
                log("Status HTTP: " + r.status);
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            })
            .then(function(data) {
                log("Resposta: " + JSON.stringify(data));
                var toggle = document.getElementById("aptToggle");
                toggle.checked  = data.enableNextEpisodeAutoPlay;
                toggle.disabled = false;
                setBadge(data.enableNextEpisodeAutoPlay ? "on" : "off");
                showError(null);
            })
            .catch(function(e) {
                err("loadStatus falhou:", e);
                showError("Erro: " + e.message + " — veja o console (F12)");
                setBadge("loading");
            });
    }

    function saveStatus(userId, newValue) {
        var toggle = document.getElementById("aptToggle");
        toggle.disabled = true;
        setBadge("loading");
        showError(null);

        apiFetch("POST", "AutoPlay/Toggle", { UserId: userId, Enable: newValue })
            .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            })
            .then(function(data) {
                toggle.disabled = false;
                toggle.checked  = data.enableNextEpisodeAutoPlay;
                setBadge(data.enableNextEpisodeAutoPlay ? "on" : "off");
            })
            .catch(function(e) {
                err("saveStatus falhou:", e);
                toggle.checked  = !newValue;
                toggle.disabled = false;
                setBadge(!newValue ? "on" : "off");
                showError("Erro ao salvar: " + e.message);
            });
    }

    function init() {
        if (initialized) return;

        if (typeof ApiClient === "undefined") {
            log("ApiClient ainda não disponível, aguardando...");
            setTimeout(init, 200);
            return;
        }

        var userId = getUserId();
        var token  = getToken();

        // Diagnóstico completo no console
        log("=== Diagnóstico ===");
        log("window.location.origin: " + window.location.origin);
        log("userId: " + userId);
        log("token: " + (token ? token.substring(0,8) + "..." : "NULL"));
        log("ApiClient.serverAddress: " + (typeof ApiClient.serverAddress === "function" ? ApiClient.serverAddress() : ApiClient.serverAddress));

        if (!userId) {
            log("userId vazio, aguardando...");
            setTimeout(init, 200);
            return;
        }

        initialized = true;
        log("Inicializando para userId=" + userId);
        loadStatus(userId);
        document.getElementById("aptToggle").addEventListener("change", function () {
            saveStatus(userId, this.checked);
        });
    }

    document.addEventListener("DOMContentLoaded", init);
    document.addEventListener("viewshow", init);
    document.addEventListener("pageshow", init);
    setTimeout(init, 500);
}());
</script>
</body>
</html>
