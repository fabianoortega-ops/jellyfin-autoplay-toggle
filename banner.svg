<svg width="100%" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#001a24"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>
  <text x="450" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="700" text-anchor="middle">
    <tspan fill="#ffffff">🔁 AutoPlay </tspan><tspan fill="#00a4dc">Toggle</tspan>
  </text>
  <text x="450" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#00a4dc" text-anchor="middle">Toggle next episode autoplay directly from the Jellyfin player</text>
  <text x="450" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#555" text-anchor="middle">One button. No menus. No settings. Just play or stop.</text>
