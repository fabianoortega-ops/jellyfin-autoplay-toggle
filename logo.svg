<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#001a24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Outer ring (repeat arrows) -->
  <!-- Top arrow going right -->
  <path d="M 72 90 A 56 56 0 0 1 184 90" fill="none" stroke="#00a4dc" stroke-width="14" stroke-linecap="round"/>
  <polygon points="184,72 200,90 184,108" fill="#00a4dc"/>

  <!-- Bottom arrow going left -->
  <path d="M 184 166 A 56 56 0 0 1 72 166" fill="none" stroke="#00a4dc" stroke-width="14" stroke-linecap="round"/>
  <polygon points="72,148 56,166 72,184" fill="#00a4dc"/>

  <!-- Play triangle in center -->
  <polygon points="108,100 108,156 164,128" fill="#ffffff" opacity="0.95"/>
</svg>
