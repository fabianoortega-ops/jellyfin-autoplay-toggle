<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#001a24"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- 🔁 emoji rendered as text -->
  <text x="128" y="130" font-size="80" text-anchor="middle" dominant-baseline="middle">🔁</text>

  <!-- AutoPlay in white -->
  <text x="128" y="182" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">AutoPlay</text>

  <!-- Toggle in Jellyfin blue -->
  <text x="128" y="214" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#00a4dc" text-anchor="middle">Toggle</text>
</svg>
